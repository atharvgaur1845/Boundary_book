name: Fetch IPL feed

on:
  schedule:
    - cron: '0 */3 * * *'     # every 3 hours — delta cache + cached series keeps us ~30 calls/day
  workflow_dispatch:            # manual trigger from the Actions tab

permissions:
  contents: write              # needed to commit data/feed.json back to the repo

concurrency:
  group: fetch-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build feed
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
        run: node scripts/fetch.js

      - name: Commit feed if changed
        run: |
          git config user.name  "boundary-book[bot]"
          git config user.email "boundary-book-bot@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feed: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
